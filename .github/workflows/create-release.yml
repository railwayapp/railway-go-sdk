name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Release
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ inputs.bump }}
