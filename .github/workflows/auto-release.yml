name: Auto Release

on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-bump
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  prepare:
    name: Determine release
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release/patch') ||
       contains(github.event.pull_request.labels.*.name, 'release/minor') ||
       contains(github.event.pull_request.labels.*.name, 'release/major'))
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.release-type.outputs.bump }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wait for batch window
        run: sleep 120

      - name: Wait for CI on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          echo "Main SHA: $MAIN_SHA"

          for _ in {1..20}; do
            CI_RUN=$(gh run list --workflow ci.yml --branch main --commit "$MAIN_SHA" --event push \
              --json databaseId,status,conclusion --limit 1 --jq '.[0] // {}')
            STATUS=$(echo "$CI_RUN" | jq -r '.status // "pending"')
            CONCLUSION=$(echo "$CI_RUN" | jq -r '.conclusion // ""')

            echo "CI status: $STATUS ${CONCLUSION:+($CONCLUSION)}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                git reset --hard "$MAIN_SHA"
                exit 0
              fi
              echo "CI completed with conclusion: $CONCLUSION"
              exit 1
            fi

            sleep 30
          done
          echo "Timed out waiting for CI on $MAIN_SHA"
          exit 1

      - name: Determine release type
        id: release-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo "")
          rm -f /tmp/bump_types
          touch /tmp/bump_types

          if [ -n "$LAST_TAG" ]; then
            for pr_num in $(git log "$LAST_TAG"..HEAD --oneline | grep -oE '#[0-9]+' | tr -d '#' | sort -u || true); do
              LABELS=$(gh pr view "$pr_num" --json labels --jq '.labels[].name' 2>/dev/null || echo "")
              for label in $LABELS; do
                case "$label" in
                  release/major) echo "major" >> /tmp/bump_types ;;
                  release/minor) echo "minor" >> /tmp/bump_types ;;
                  release/patch) echo "patch" >> /tmp/bump_types ;;
                esac
              done
            done
          fi

          if [ -s /tmp/bump_types ]; then
            if grep -q "major" /tmp/bump_types; then
              BUMP="major"
            elif grep -q "minor" /tmp/bump_types; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          else
            if ${{ contains(github.event.pull_request.labels.*.name, 'release/major') }}; then
              BUMP="major"
            elif ${{ contains(github.event.pull_request.labels.*.name, 'release/minor') }}; then
              BUMP="minor"
            else
              BUMP="patch"
            fi
          fi

          echo "Bump: $BUMP"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"

  release:
    name: Release
    needs: prepare
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      bump: ${{ needs.prepare.outputs.bump }}
